<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="450" fill="#fbeaea"/>

  <!-- city blocks -->
  <g fill="#fdf3f3">
    <rect x="20" y="20" width="170" height="110" rx="8"/>
    <rect x="215" y="20" width="150" height="110" rx="8"/>
    <rect x="430" y="20" width="170" height="110" rx="8"/>
    <rect x="625" y="20" width="155" height="110" rx="8"/>
    <rect x="20" y="160" width="170" height="120" rx="8"/>
    <rect x="430" y="160" width="170" height="120" rx="8"/>
    <rect x="625" y="160" width="155" height="120" rx="8"/>
    <rect x="20" y="310" width="170" height="120" rx="8"/>
    <rect x="215" y="310" width="150" height="120" rx="8"/>
    <rect x="430" y="310" width="170" height="120" rx="8"/>
    <rect x="625" y="310" width="155" height="120" rx="8"/>
  </g>

  <!-- park -->
  <rect x="215" y="160" width="150" height="120" rx="8" fill="#e6eedc"/>
  <circle cx="260" cy="205" r="14" fill="#d3e2c4"/>
  <circle cx="310" cy="240" r="18" fill="#d3e2c4"/>
  <circle cx="335" cy="190" r="10" fill="#d3e2c4"/>

  <!-- river -->
  <path d="M-10 395 C150 360 250 440 400 410 S650 360 810 400" fill="none" stroke="#dbe8f2" stroke-width="26" stroke-linecap="round"/>

  <!-- main roads -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M0 145 H800" stroke-width="22"/>
    <path d="M0 295 H800" stroke-width="22"/>
    <path d="M202 0 V450" stroke-width="22"/>
    <path d="M612 0 V450" stroke-width="22"/>
    <path d="M398 0 V450" stroke-width="14"/>
  </g>
  <!-- road center lines -->
  <g stroke="#f6d5d8" stroke-width="2" stroke-dasharray="10 10" fill="none">
    <path d="M0 145 H800"/>
    <path d="M0 295 H800"/>
    <path d="M202 0 V450"/>
    <path d="M612 0 V450"/>
  </g>

  <!-- pin shadow -->
  <ellipse cx="400" cy="262" rx="26" ry="8" fill="#a8445b" opacity=".25"/>
  <!-- pulse -->
  <circle cx="400" cy="145" r="48" fill="#c4566e" opacity=".12"/>
  <!-- pin -->
  <path d="M400 258 C400 258 358 204 358 164 A42 42 0 0 1 442 164 C442 204 400 258 400 258 Z" fill="#c4566e"/>
  <circle cx="400" cy="164" r="16" fill="#ffffff"/>
</svg>
